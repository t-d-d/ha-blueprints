blueprint:
  name: Better Thermostat - Matrix Edition (with Zones)
  domain: automation
  description: |-
    Advanced control for Better Thermostat (v1.8+).
    
    LOGIC PRIORITY:
    1. Smart Override (User Template)
       - Can force a specific preset or fall back to a default.
    2. Away Matrix (Schedule On/Off)
       - Active only if everyone is Away AND not in any monitored Zone.
    3. Home Matrix (Schedule On/Off)
       - Default state.

    MANUAL CHANGES:
    Changing the temperature on a dial saves it as the new temperature for
    the preset the room was in, and keeps the room in that preset.
    (Better Thermostat 1.8.2+ drops to preset "none" on a manual change.)

  source_url: https://github.com/t-d-d/ha-blueprints/blob/master/bt-scheduler.yaml

  input:
    target_bt:
      name: Better Thermostats
      description: The climate entity to control.
      selector:
        target:
          device:
            integration: better_thermostat
          entity:
            integration: better_thermostat
            domain: climate

    schedule_entity:
      name: Schedule
      description: Defines your "Awake/Active" hours (On) vs "Sleep" hours (Off).
      selector:
        entity:
          domain: schedule

    monitor_person:
      name: Persons
      description: Automation enters "Away" mode only if ALL these people are absent.
      default: []
      selector:
        entity:
          domain: person
          multiple: true

    monitor_zones:
      name: Zones
      description: >
        Additional zones where you are considered "Home". 
        (e.g., 'Garden', 'Neighbors').
      default: []
      selector:
        entity:
          domain: zone
          multiple: true

    # --- MATRIX PRESETS ---
    preset_home_sched:
      name: 🏠 Home + Active (Schedule On)
      description: Standard comfort mode.
      default: 'home'
      selector: &preset_selector
        select:
          options: [home, comfort, active, boost, none]
          custom_value: true

    preset_home_sleep:
      name: 🏠 Home + Sleep (Schedule Off)
      description: Night setback / Sleep mode.
      default: 'sleep'
      selector: &preset_selector_eco
        select:
          options: [sleep, eco, night, 'off', none, away]
          custom_value: true

    preset_away_sched:
      name: 🚲 Away + Active (Schedule On)
      description: Daytime Away. Use 'Eco' for efficient pre-heating.
      default: 'eco'
      selector: *preset_selector_eco

    preset_away_sleep:
      name: 🚲 Away + Sleep (Schedule Off)
      description: Night Away. Use 'Away' or 'Off'.
      default: 'away'
      selector: *preset_selector_eco

    # --- OVERRIDE ---
    override_template:
      name: Smart Override Logic
      description: >
        Return a preset name (e.g., 'boost') to force that state.
        Return 'True' to use the Default Override Preset below.
        
        VARIABLES AVAILABLE:
        - is_scheduled (bool)
        - is_someone_home (bool)
      default: "{{ false }}"
      selector:
        template: {}

    preset_override_default:
      name: Default Override Preset
      description: Used if your Template Logic returns simple 'True'.
      default: 'boost'
      selector: *preset_selector

# Queued so a manual change is never dropped while a 5-minute run is going,
# and the 5-minute run waits until a manual change has been saved.
mode: queued
max: 10

trigger_variables:
  tv_target: !input target_bt

trigger:
#  - platform: state
#    entity_id: !input schedule_entity
#  - platform: state
#    entity_id: !input monitor_person
  - platform: time_pattern
    minutes: "/5"
    id: tick

  # Fires when one of this automation's Better Thermostats drops to preset
  # "none", which is what Better Thermostat does on a manual temperature change.
  - platform: template
    id: manual_change
    value_template: >-
      {%- set t = tv_target if tv_target is mapping else {} -%}
      {%- set e = t.get('entity_id', []) -%}{%- set e = [e] if e is string else e -%}
      {%- set d = t.get('device_id', []) -%}{%- set d = [d] if d is string else d -%}
      {%- set a = t.get('area_id', []) -%}{%- set a = [a] if a is string else a -%}
      {%- set ns = namespace(ents=e | list) -%}
      {%- for x in d %}{% set ns.ents = ns.ents + device_entities(x) %}{% endfor -%}
      {%- for x in a %}{% set ns.ents = ns.ents + area_entities(x) %}{% endfor -%}
      {%- set bts = ns.ents | select('match', '^climate\\.')
            | select('in', integration_entities('better_thermostat')) | unique | list -%}
      {{ bts | select('is_state_attr', 'preset_mode', 'none') | list | count > 0 }}

variables:
  # 1. Load Inputs
  schedule_entity: !input schedule_entity
  monitor_person: !input monitor_person
  monitor_zones: !input monitor_zones
  
  # Presets
  p_home_sched: !input preset_home_sched
  p_home_sleep: !input preset_home_sleep
  p_away_sched: !input preset_away_sched
  p_away_sleep: !input preset_away_sleep
  p_over_def: !input preset_override_default

  # 2. Context Helpers
  is_scheduled: "{{ is_state(schedule_entity, 'on') }}"
  
  # Calculate Presence (Home + Zones)
  # People states return the 'Friendly Name' of the zone they are in.
  zone_names: "{{ expand(monitor_zones) | map(attribute='attributes.friendly_name') | list }}"
  is_someone_home: >-
    {% set people_states = expand(monitor_person) | map(attribute='state') | list %}
    {% set valid_locations = ['home', 'on'] + zone_names %}
    {# Check if any person is in a valid location #}
    {{ people_states | select('in', valid_locations) | list | count > 0 }}

  # 3. Evaluate Override
  raw_override: !input override_template
  
  # 4. THE DECISION ENGINE
  final_preset: >-
    {# --- CHECK OVERRIDE FIRST --- #}
    {% if raw_override in [true, 'True', 'true', 'on'] %}
      {{ p_over_def }}
    {% elif raw_override not in [false, 'False', 'false', 'off', '', none] %}
      {{ raw_override }}
    
    {# --- CHECK AWAY MATRIX --- #}
    {% elif not is_someone_home %}
      {{ p_away_sched if is_scheduled else p_away_sleep }}
      
    {# --- DEFAULT TO HOME MATRIX --- #}
    {% else %}
      {{ p_home_sched if is_scheduled else p_home_sleep }}
    {% endif %}

action:
  - choose:
      # --- MANUAL CHANGE: save the dial temperature into the preset ---
      - conditions:
          - condition: trigger
            id: manual_change
        sequence:
          # Let rapid dial taps settle before reading the temperature.
          - delay:
              seconds: 2
          - variables:
              bt: "{{ trigger.to_state.entity_id }}"
              old_preset: >-
                {{ (trigger.from_state.attributes.preset_mode if trigger.from_state else none)
                   | default('none', true) }}
              new_temp: "{{ state_attr(bt, 'temperature') }}"
              preset_number: >-
                {{ device_entities(device_id(bt))
                   | select('match', '^number\\..*_preset_' ~ old_preset ~ '$')
                   | first | default('', true) }}
          # Only act on a person's change (not another automation's), while the
          # room is still out of its preset and the preset has a stored temperature.
          - condition: template
            value_template: >-
              {{ trigger.to_state.context.parent_id is none
                 and is_state_attr(bt, 'preset_mode', 'none')
                 and old_preset not in ['none', '']
                 and new_temp is number
                 and preset_number != '' }}
          - service: number.set_value
            target:
              entity_id: "{{ preset_number }}"
            data:
              value: "{{ new_temp }}"
          - service: climate.set_preset_mode
            target:
              entity_id: "{{ bt }}"
            data:
              preset_mode: "{{ old_preset }}"

    # --- SCHEDULE: apply the preset the matrix picks ---
    default:
      # Safety Check: Do nothing if the logic somehow returns None/Empty
      - condition: template
        value_template: "{{ final_preset not in [none, '', 'None'] }}"

      - service: climate.set_preset_mode
        target: !input target_bt
        data:
          preset_mode: "{{ final_preset }}"
